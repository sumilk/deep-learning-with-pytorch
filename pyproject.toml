[project]
name = "dlcourse"
version = "0.1.0"
description = "Helpers for the Deep Learning with PyTorch course notebooks"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlcourse"]
